<!doctype html>
<meta charset="utf-8" />
<title>SeoJae Story — icon generator</title>
<!--
  Rasterises the brand mark (public/icon.svg) into every PNG the PWA / Play
  Store / iOS need. Open this file in a browser: it renders each size, shows a
  preview, and offers a download link. The full set is also on window.__ICONS__
  as a { "path": dataURL } map and mirrored into <pre id="out"> as JSON so a
  script can pull them out in one read.

  Two artworks:
    A ("any")      — the rounded-rect mark, matches public/icon.svg 1:1.
    B ("maskable") — full-bleed warm ground, art pulled into the 80% safe
                     circle so Android's shape mask never clips it.
-->
<style>
  body { font: 14px system-ui, sans-serif; margin: 24px; color: #2c2c2c; background: #fdfbf7; }
  h1 { font-size: 16px; }
  #grid { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 16px; }
  figure { margin: 0; text-align: center; }
  figure img { background: #eee; border: 1px solid #ddd; image-rendering: pixelated; }
  figcaption { font-size: 11px; margin-top: 4px; }
  figcaption a { display: block; }
  #out { position: absolute; left: -99999px; white-space: pre; }
  #status { font-weight: 600; }
</style>
<h1>SeoJae Story icon set <span id="status">generating…</span></h1>
<div id="grid"></div>
<pre id="out"></pre>
<script>
  const ART_A = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="__S__" height="__S__" role="img" aria-label="SeoJae Story">
  <rect width="64" height="64" rx="16" fill="#FDFBF7"/>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#EFD9C9" stroke-width="3"/>
  <path d="M32 21.5C26.4 17.7 18.6 16.2 11 16.7v27.9c7.6-.5 15.4 1 21 4.8 5.6-3.8 13.4-5.3 21-4.8V16.7c-7.6-.5-15.4 1-21 4.8Z" fill="#FBF3EA" stroke="#C57B57" stroke-width="3.6" stroke-linejoin="round"/>
  <path d="M32 21.5V49.4" fill="none" stroke="#C57B57" stroke-width="3.6" stroke-linecap="round"/>
  <path d="M49 5l2 5.3 5.3 2-5.3 2-2 5.3-2-5.3-5.3-2 5.3-2z" fill="#C9A66B"/>
</svg>`;

  const ART_B = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="__S__" height="__S__" role="img" aria-label="SeoJae Story">
  <rect width="64" height="64" fill="#FDFBF7"/>
  <g transform="translate(32 32) scale(0.76) translate(-33.65 -27.2)">
    <path d="M32 21.5C26.4 17.7 18.6 16.2 11 16.7v27.9c7.6-.5 15.4 1 21 4.8 5.6-3.8 13.4-5.3 21-4.8V16.7c-7.6-.5-15.4 1-21 4.8Z" fill="#FBF3EA" stroke="#C57B57" stroke-width="3.6" stroke-linejoin="round"/>
    <path d="M32 21.5V49.4" fill="none" stroke="#C57B57" stroke-width="3.6" stroke-linecap="round"/>
    <path d="M49 5l2 5.3 5.3 2-5.3 2-2 5.3-2-5.3-5.3-2 5.3-2z" fill="#C9A66B"/>
  </g>
</svg>`;

  const JOBS = [
    ["favicon.png", 32, "A"],
    ["icons/icon-32.png", 32, "A"],
    ["icons/icon-48.png", 48, "A"],
    ["icons/icon-72.png", 72, "A"],
    ["icons/icon-96.png", 96, "A"],
    ["icons/icon-128.png", 128, "A"],
    ["icons/icon-144.png", 144, "A"],
    ["icons/icon-152.png", 152, "A"],
    ["icons/icon-180.png", 180, "A"],
    ["icons/icon-192.png", 192, "A"],
    ["icons/icon-384.png", 384, "A"],
    ["icons/icon-512.png", 512, "A"],
    ["icons/icon-maskable-192.png", 192, "B"],
    ["icons/icon-maskable-512.png", 512, "B"],
  ];

  function rasterise(art, size) {
    const svg = art.replaceAll("__S__", String(size));
    const url = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext("2d");
        ctx.clearRect(0, 0, size, size);
        ctx.drawImage(img, 0, 0, size, size);
        resolve(canvas.toDataURL("image/png"));
      };
      img.onerror = reject;
      img.src = url;
    });
  }

  (async () => {
    const results = {};
    const grid = document.getElementById("grid");
    for (const [path, size, kind] of JOBS) {
      const dataUrl = await rasterise(kind === "A" ? ART_A : ART_B, size);
      results[path] = dataUrl;

      const fig = document.createElement("figure");
      const im = document.createElement("img");
      im.src = dataUrl;
      im.width = Math.min(size, 128);
      im.height = Math.min(size, 128);
      const cap = document.createElement("figcaption");
      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = path.split("/").pop();
      a.textContent = "download";
      cap.textContent = path + " (" + size + ")";
      cap.appendChild(a);
      fig.appendChild(im);
      fig.appendChild(cap);
      grid.appendChild(fig);
    }
    document.getElementById("out").textContent = JSON.stringify(results);
    window.__ICONS__ = results;
    window.__DONE__ = true;
    document.getElementById("status").textContent = "done — " + JOBS.length + " files";
  })();
</script>
