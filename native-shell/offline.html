<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SeoJae Story — Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #fdfbf7;
        color: #2c2c2c;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .wrap {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }
      svg { width: 56px; height: 56px; margin-bottom: 16px; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-size: 22px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.5; color: rgba(44, 44, 44, 0.6); max-width: 280px; margin: 0; }
      button {
        margin-top: 24px;
        border: 0;
        background: #c57b57;
        color: #fdfbf7;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 14px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <!-- Shown by Capacitor (server.errorPath) when the live site can't be
         reached. Bundled in the app, so it works with no connection at all. -->
    <div class="wrap">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M12 7.2C9.9 5.8 7 5.2 4.2 5.4v10.5c2.9-.2 5.8.4 7.8 1.8 2-1.4 4.9-2 7.8-1.8V5.4C17 5.2 14.1 5.8 12 7.2Z" fill="#c57b57" fill-opacity="0.16" stroke="#c57b57" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M12 7.2v10.3" stroke="#c57b57" stroke-width="1.6" stroke-linecap="round"/>
      </svg>
      <h1>You're offline</h1>
      <p>SeoJae Story needs a connection to load your stories. Check your connection and try again.</p>
      <button type="button" onclick="window.location.replace('https://www.seojaestory.app/')">Try again</button>
    </div>
  </body>
</html>
