<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Fir Tree by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#C9A66B" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -48 L16 -14 L7 -14 L22 12 L11 12 L28 40 L-28 40 L-11 12 L-22 12 L-7 -14 L-16 -14 Z"/>
    <line x1="0" y1="40" x2="0" y2="52"/>
    <path d="M0 -60 l3.5 8 8 1 -6 6 1.6 8.4 -7.1 -4 -7.1 4 1.6 -8.4 -6 -6 8 -1 z" fill="#C9A66B" stroke="#C9A66B" stroke-width="0.8"/>
  </g>

  <text x="200" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="36" fill="#2C2C2C" letter-spacing="1">The Fir Tree</text>

  <line x1="150" y1="354" x2="250" y2="354" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="387" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#C57B57">Glad of the day, too late</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="2.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1844</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
