      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 168)">
    <path d="M0 -22 C 13 -6 13 12 0 26 C -13 12 -13 -6 0 -22 Z" fill="#C9A66B" stroke="none"/>
    <line x1="0" y1="-19" x2="0" y2="30" stroke="#C9A66B" stroke-width="1.6" stroke-linecap="round"/>
    <g stroke="#FDFBF7" stroke-width="0.9" stroke-linecap="round" opacity="0.75">
      <path d="M0 -9 L-8 -3"/>
