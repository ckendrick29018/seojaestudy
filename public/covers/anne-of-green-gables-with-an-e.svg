  <text x="201" y="212" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="104" fill="#C9A66B">E</text>
  <path d="M158 226 q 43 15 84 0" fill="none" stroke="#C9A66B" stroke-width="1.5" opacity="0.6"/>
