<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Chunhyangjeon, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-18 -46 L -34 24" stroke-width="1.4"/>
    <path d="M18 -46 L 34 24" stroke-width="1.4"/>
    <path d="M-34 24 L 34 24" stroke-width="1.8"/>
    <path d="M-22 -50 q 22 -10 44 0" stroke-width="1.2" opacity="0.6"/>
    <circle cx="0" cy="-12" r="4" fill="#C9A66B" fill-opacity="0.5" stroke="none"/>
    <circle cx="-14" cy="-2" r="2.6" fill="#C9A66B" fill-opacity="0.4" stroke="none"/>
    <circle cx="14" cy="-2" r="2.6" fill="#C9A66B" fill-opacity="0.4" stroke="none"/>
    <path d="M-40 34 q 40 14 80 0" stroke-width="1.1" opacity="0.4"/>
  </g>

  <text x="200" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#2C2C2C" letter-spacing="1">춘향전</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A love that would not bend</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">CHUNHYANGJEON &#183; JOSEON ERA</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
