    <path d="M-46 76 q 30 -9 46 -4 t 46 0" stroke-width="1.1" opacity="0.35"/>
  </g>

  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2C2C2C" letter-spacing="1">The Princess</text>
  <text x="200" y="353" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2C2C2C" letter-spacing="1">and the Pea</text>

  <line x1="150" y1="388" x2="250" y2="388" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="420" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">Twenty mattresses and one pea</text>

  <text x="200" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="488" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9A8F80" letter-spacing="2">1835</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
