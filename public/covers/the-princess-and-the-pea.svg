    <rect x="-42" y="30" width="84" height="11" rx="5.5" stroke-width="1.7" transform="rotate(1.3 0 35.5)"/>
    <rect x="-38" y="17" width="76" height="11" rx="5.5" stroke-width="1.7" transform="rotate(-1 0 22.5)"/>
    <rect x="-41" y="4" width="82" height="11" rx="5.5" stroke-width="1.7" transform="rotate(1.6 0 9.5)"/>
    <rect x="-37" y="-9" width="74" height="11" rx="5.5" stroke-width="1.7" transform="rotate(-1.2 0 -3.5)"/>
    <rect x="-39" y="-22" width="78" height="11" rx="5.5" stroke-width="1.7" transform="rotate(1 0 -16.5)"/>
    <ellipse cx="0" cy="-31" rx="17" ry="7" stroke-width="1.4"/>
    <path d="M-11 -39 L-11 -48 L-3.5 -42 L0 -51 L3.5 -42 L11 -48 L11 -39 Z" stroke-width="1.5"/>
