<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Princess and the Pea by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 170)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-44 61 H 44 M-37 61 V 71 M37 61 V 71" stroke-width="2"/>
    <circle cx="0" cy="57" r="2.4" fill="#C9A66B" stroke="none"/>
