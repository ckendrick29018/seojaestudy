    <path d="M12 8 Q6 -6 16 -10 Q22 -8 18 4 Z" fill="#EBD3B8" fill-opacity="0.45"/>
    <circle cx="24" cy="18" r="1.6" fill="#A9663F" stroke="none"/>
    <circle cx="42" cy="18" r="1.6" fill="#A9663F" stroke="none"/>
    <path d="M32 30 L36 34 L40 29" fill="none"/>

