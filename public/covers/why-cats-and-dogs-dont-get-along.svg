<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Why Cats and Dogs Don't Get Along, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 186)" stroke="#A9663F" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="-34" cy="18" rx="24" ry="16" fill="#EBD3B8" fill-opacity="0.45"/>
    <path d="M-52 8 L-58 -8 L-46 0 Z" fill="#EBD3B8" fill-opacity="0.45"/>
    <path d="M-42 8 L-44 -10 L-34 -2 Z" fill="#EBD3B8" fill-opacity="0.45"/>
    <circle cx="-42" cy="16" r="1.6" fill="#A9663F" stroke="none"/>
    <circle cx="-28" cy="16" r="1.6" fill="#A9663F" stroke="none"/>

