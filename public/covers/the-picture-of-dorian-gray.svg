<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Picture of Dorian Gray by Oscar Wilde">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-20" y="-32" width="40" height="52" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.14"/>
    <rect x="-14" y="-26" width="28" height="40" stroke-width="0.8" opacity="0.5"/>
    <ellipse cx="0" cy="-8" rx="9" ry="12" stroke-width="1" fill="#C9A66B" fill-opacity="0.22"/>
    <path d="M-20 20 L-30 40 M20 20 L30 40 M-24 34 L24 34" stroke-width="1.1"/>
  </g>

  <text x="200" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">The Picture of</text>
  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">Dorian Gray</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" font-style="italic" fill="#C57B57">Every portrait is a portrait of the artist</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">OSCAR WILDE</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">THE PORTRAIT</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
