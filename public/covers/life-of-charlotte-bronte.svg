      <circle cx="0" cy="-14" r="6" stroke-width="1.4"/>
      <line x1="0" y1="20" x2="0" y2="32" stroke-width="1.4"/>
    </g>
    <g transform="translate(12 4)">
      <rect x="-6" y="-6" width="12" height="26" rx="2" stroke-width="1.4" fill="#8FB2CC" fill-opacity="0.18"/>
      <circle cx="0" cy="-14" r="6" stroke-width="1.4"/>
      <line x1="0" y1="20" x2="0" y2="32" stroke-width="1.4"/>
