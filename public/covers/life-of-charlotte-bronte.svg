  <text x="200" y="401" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#5C84A8">The childhood games that grew into Jane Eyre</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#5C84A8" letter-spacing="2">ELIZABETH GASKELL</text>
