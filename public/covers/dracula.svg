<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Dracula by Bram Stoker">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 174)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-24 10 L 0 -26 L 24 10 Q 12 2 0 10 Q -12 2 -24 10 Z" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.14"/>
    <path d="M-10 10 L -10 40 M 10 10 L 10 40" stroke-width="1.3"/>
