<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Prince Sandalwood, the Father of Korea, a traditional Korean founding myth">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 180)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -54 L0 40" stroke-width="1.6"/>
    <path d="M0 -30 Q-34 -38 -46 -12 Q-24 -6 0 -20" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.5"/>
    <path d="M0 -30 Q34 -38 46 -12 Q24 -6 0 -20" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.5"/>
    <path d="M0 -6 Q-30 -12 -40 14 Q-18 20 0 4" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.4"/>
    <path d="M0 -6 Q30 -12 40 14 Q18 20 0 4" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.4"/>
    <circle cx="-22" cy="52" r="11" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.6"/>
    <circle cx="20" cy="56" r="10" stroke-width="1.4" fill="#EBD3B8" fill-opacity="0.6"/>
    <path d="M-30 66 Q-22 60 -14 66" stroke-width="1.2"/>
    <path d="M12 70 Q20 64 28 70" stroke-width="1.2"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="1">Prince Sandalwood,</text>
  <text x="200" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="1">the Father of Korea</text>

  <line x1="150" y1="358" x2="250" y2="358" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A bear, a cave, and twenty-one days</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOUNDING MYTH</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
