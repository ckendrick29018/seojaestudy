    <path d="M-52 44 q 52 16 104 0" stroke-width="1.1" opacity="0.4"/>
  </g>

  <text x="200" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">The Boy Who Loved</text>
  <text x="200" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">Beetles</text>

