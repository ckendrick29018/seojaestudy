<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Boy Who Loved Beetles by Charles Darwin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F8FB"/>
      <stop offset="1" stop-color="#E6F0F6"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#5C84A8" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#8FB2CC" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#6E97B8" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="4" rx="20" ry="30" stroke-width="1.8"/>
    <line x1="0" y1="-26" x2="0" y2="34" stroke-width="1.1" opacity="0.6"/>
    <path d="M-20 -8 L -38 -18 M-20 4 L -40 4 M-20 16 L -38 26" stroke-width="1.2"/>
    <path d="M20 -8 L 38 -18 M20 4 L 40 4 M20 16 L 38 26" stroke-width="1.2"/>
