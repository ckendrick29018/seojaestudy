    <g stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-30 42 L-24 -10 Q-24 -34 0 -34 Q24 -34 24 -10 L30 42" stroke-width="1.9"/>
      <path d="M-30 42 Q0 54 30 42" stroke-width="1.6"/>
      <path d="M-12 -8 Q-8 -14 -3 -8 M3 -8 Q8 -14 12 -8" stroke-width="1.4"/>
      <path d="M-10 8 Q0 14 10 8" stroke-width="1.4"/>
      <path d="M-24 -12 Q-34 -22 -30 -34 M24 -12 Q34 -22 30 -34" stroke-width="1.4"/>
    </g>
    <path d="M-4 -70 Q0 -84 4 -70 Q10 -76 8 -86 Q2 -90 0 -96 Q-2 -90 -8 -86 Q-10 -76 -4 -70 Z" fill="#D98B3F" fill-opacity="0.85" stroke="none"/>
