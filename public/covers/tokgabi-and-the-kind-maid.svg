  <text x="200" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">Kind Maid</text>

  <line x1="150" y1="374" x2="250" y2="374" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="406" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A little mischief, a lot of heart</text>

