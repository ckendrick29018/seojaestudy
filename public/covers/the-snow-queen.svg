<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Snow Queen by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#C9A66B" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="-46" x2="0" y2="46"/>
    <line x1="-39.8" y1="-23" x2="39.8" y2="23"/>
    <line x1="-39.8" y1="23" x2="39.8" y2="-23"/>
    <path d="M0 -46 l-8 -10 M0 -46 l8 -10 M0 46 l-8 10 M0 46 l8 10"/>
    <path d="M-39.8 -23 l-3 -12.5 M-39.8 -23 l11.5 -6.3 M39.8 23 l3 12.5 M39.8 23 l-11.5 6.3"/>
    <path d="M-39.8 23 l-11.5 -6.3 M-39.8 23 l3 12.5 M39.8 -23 l11.5 6.3 M39.8 -23 l-3 -12.5"/>
    <circle cx="0" cy="0" r="4.5" fill="#C9A66B" stroke="none"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2C2C2C" letter-spacing="1">The Snow</text>
  <text x="200" y="344" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2C2C2C" letter-spacing="1">Queen</text>

  <line x1="150" y1="378" x2="250" y2="378" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A warm tear for a frozen heart</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#C57B57" letter-spacing="2.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1844</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
