<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Woman in White by Wilkie Collins">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-38" r="32" stroke-width="0.9" opacity="0.5"/>
    <circle cx="0" cy="-38" r="24" fill="#C9A66B" fill-opacity="0.16" stroke-width="0.9"/>
    <path d="M-30 40 Q-26 -4 0 -4 Q26 -4 30 40 Z" stroke-width="1.6" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M-16 20 L-16 40 M0 16 L0 40 M16 20 L16 40" stroke-width="0.9" opacity="0.5"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">The Woman</text>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">in White</text>

  <line x1="150" y1="348" x2="250" y2="348" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A hand on his shoulder</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">WILKIE COLLINS</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">THE PROLOGUE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
