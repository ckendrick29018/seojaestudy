<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Amos Barton by George Eliot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-30 4 L 0 -30 L 30 4 Z" stroke-width="1.6" fill="#C9A66B" fill-opacity="0.14"/>
    <rect x="-22" y="4" width="44" height="34" stroke-width="1.4" fill="#C9A66B" fill-opacity="0.1"/>
    <path d="M-6 38 L -6 20 Q 0 12 6 20 L 6 38" stroke-width="1.2"/>
    <path d="M0 -30 L 0 -42" stroke-width="1.6"/>
    <path d="M-6 -36 L 6 -36" stroke-width="1.6"/>
    <path d="M-34 40 q 34 12 68 0" stroke-width="1.1" opacity="0.4"/>
  </g>

  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#2C2C2C" letter-spacing="1">Amos Barton</text>

  <line x1="150" y1="350" x2="250" y2="350" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="382" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A curate's worry, a candle, and a wife's calm faith</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">GEORGE ELIOT</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FROM SCENES OF CLERICAL LIFE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
