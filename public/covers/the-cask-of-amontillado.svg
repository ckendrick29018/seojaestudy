<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Cask of Amontillado by Edgar Allan Poe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-22 -32 L 22 -32 L 22 30 Q 22 40 0 40 Q -22 40 -22 30 Z" stroke-width="1.8"/>
    <path d="M-22 -20 L 22 -20 M-22 -6 L 22 -6" stroke-width="1.1" opacity="0.6"/>
    <rect x="-30" y="-40" width="60" height="10" rx="2" fill="#C9A66B" fill-opacity="0.15" stroke-width="1.5"/>
    <path d="M-38 46 q 38 14 76 0 q 38 14 76 0" stroke-width="1.1" opacity="0.4"/>
  </g>

  <text x="200" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">The Cask of</text>
  <text x="200" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">Amontillado</text>

  <line x1="150" y1="396" x2="250" y2="396" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="429" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">For the love of God, Montresor!</text>

  <text x="200" y="470" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9A8F80" letter-spacing="2">1846</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
