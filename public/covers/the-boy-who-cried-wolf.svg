  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">The Boy Who</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">Cried Wolf</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

