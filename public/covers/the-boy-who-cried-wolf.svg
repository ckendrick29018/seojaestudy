      <stop offset="0" stop-color="#FBFCF6"/>
      <stop offset="1" stop-color="#E4EAC7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#6E8F4F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 -44 A16 16 0 1 0 18 -12 A12.5 12.5 0 1 1 18 -44 Z" fill="#C9A66B" fill-opacity="0.16" stroke-width="1.3"/>
    <circle cx="-30" cy="-38" r="1.2" fill="#6E8F4F" stroke="none"/>
    <circle cx="-40" cy="-28" r="1" fill="#6E8F4F" stroke="none"/>

    <path d="M-46 30 Q-46 12 -34 4 L-38 -12 L-24 -2 Q-14 -6 -4 0 L6 -14 L4 4 Q16 10 14 22 Q12 32 0 32 Q-2 40 -12 38 Q-14 44 -24 42 Q-34 44 -40 38 Q-46 36 -46 30 Z" stroke-width="1.8"/>
    <path d="M-26 8 Q-20 4 -14 8" stroke-width="1.3"/>
    <circle cx="-20" cy="10" r="1.3" fill="#6E8F4F" stroke="none"/>
    <path d="M-4 16 Q4 22 2 30" stroke-width="1.4"/>
    <path d="M-30 -6 L-38 -14 M-24 -8 L-28 -18 M-16 -8 L-16 -18" stroke-width="1" opacity="0.55"/>
