<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Golden Key, a Brothers Grimm tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 170) rotate(45)" stroke="#C9A66B" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-30" cy="0" r="14"/>
    <circle cx="-30" cy="0" r="5.5" fill="#C9A66B" stroke="none"/>
    <line x1="-16" y1="0" x2="34" y2="0"/>
    <path d="M34 0 v12 M27 0 v9 M20 0 v9"/>
  </g>

  <text x="200" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="0.5">The Golden Key</text>

  <line x1="150" y1="346" x2="250" y2="346" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="379" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#C57B57">A box, and a lid still shut</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="3">BROTHERS GRIMM</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">COLLECTED 1812</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
