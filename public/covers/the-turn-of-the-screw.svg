<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Turn of the Screw by Henry James">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 180)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -50 L0 8" stroke-width="1.6"/>
    <path d="M-9 8 Q0 22 9 8 Q9 26 0 34 Q-9 26 -9 8 Z" fill="#C9A66B" fill-opacity="0.22" stroke-width="1.2"/>
    <path d="M-14 -50 Q0 -60 14 -50 Q14 -40 0 -38 Q-14 -40 -14 -50 Z" fill="#C9A66B" fill-opacity="0.3" stroke-width="1.2"/>
    <path d="M-2 34 Q-2 48 -2 52" stroke-width="1.1" opacity="0.5"/>
    <path d="M-24 52 Q0 46 20 52" stroke-width="1" opacity="0.5"/>
    <path d="M0 -68 Q4 -60 0 -52 Q-4 -60 0 -68 Z" fill="#C9A66B" fill-opacity="0.4" stroke-width="0.8" opacity="0.7"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2C2C2C" letter-spacing="0.5">The Turn of</text>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="23" fill="#2C2C2C" letter-spacing="0.5">the Screw</text>

  <line x1="150" y1="348" x2="250" y2="348" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A story stranger than any told</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">HENRY JAMES</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">THE PROLOGUE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
