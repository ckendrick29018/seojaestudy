<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="After Twenty Years by O. Henry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 174)" stroke="#C9A66B" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="6" r="40" stroke-width="1.9"/>
    <circle cx="0" cy="6" r="33" stroke-width="1" opacity="0.5"/>
    <circle cx="0" cy="-50" r="5"/>
    <path d="M0 -45 v10" stroke-width="2"/>
    <path d="M-8 -34 q 8 -11 16 0"/>
    <path d="M0 6 v-22 M0 6 l 15 9" stroke-width="1.6"/>
    <circle cx="0" cy="6" r="2.4" fill="#C9A66B" stroke="none"/>
    <path d="M0 -26 v6 M0 38 v-6 M-32 6 h6 M32 6 h-6" stroke-width="1" opacity="0.55"/>
  </g>

  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="31" fill="#2C2C2C" letter-spacing="1">After Twenty Years</text>

  <line x1="150" y1="356" x2="250" y2="356" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">A promise kept, twenty years on</text>

  <text x="200" y="434" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="3">O. HENRY</text>
  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9A8F80" letter-spacing="2">1906</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
