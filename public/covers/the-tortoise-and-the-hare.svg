<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Tortoise and the Hare, an Aesop's fable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCF6"/>
      <stop offset="1" stop-color="#E4EAC7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#6E8F4F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-56 24 Q-20 8 20 12 Q46 15 54 26" stroke-width="1.1" stroke-dasharray="1 7" opacity="0.6"/>

    <path d="M-46 14 Q-46 -6 -30 -8 Q-14 -10 -12 6 Q-10 18 -26 20 Q-42 22 -46 14 Z" stroke-width="1.7" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M-34 -6 L-30 6 M-24 -8 L-22 6 M-16 -6 L-16 8" stroke-width="1" opacity="0.55"/>
    <path d="M-48 12 Q-52 16 -50 20" stroke-width="1.4"/>
    <path d="M-14 14 Q-8 18 -10 22" stroke-width="1.4"/>
    <circle cx="-40" cy="4" r="1.4" fill="#6E8F4F" stroke="none"/>

    <path d="M18 8 Q18 -6 30 -14 Q26 -4 28 4 Q40 0 46 -8 Q42 2 34 8 Q42 10 48 6 Q42 16 32 14 Q34 22 28 26 Q26 18 22 14 Q10 20 2 16 Q10 12 18 8 Z" stroke-width="1.7"/>
    <path d="M28 -12 L26 -22 M32 -12 L36 -21" stroke-width="1.3"/>
    <circle cx="20" cy="10" r="1.3" fill="#6E8F4F" stroke="none"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2C2C2C" letter-spacing="1">The Tortoise</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2C2C2C" letter-spacing="1">and the Hare</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Slow and steady wins the race</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">AESOP'S FABLES</text>
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">ANCIENT GREECE &#183; C. 6TH CENTURY BCE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FABLES</text>
