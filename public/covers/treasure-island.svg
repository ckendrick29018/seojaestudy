<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Treasure Island by Robert Louis Stevenson">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 174)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-28" r="4.5" stroke-width="1.3"/>
    <path d="M0 -23 L 0 20" stroke-width="1.5"/>
    <path d="M-15 -8 L 15 -8" stroke-width="1.3"/>
    <path d="M0 20 Q -22 20 -24 1" stroke-width="1.3"/>
    <path d="M0 20 Q 22 20 24 1" stroke-width="1.3"/>
    <path d="M-24 1 l 7 3 M 24 1 l -7 3" stroke-width="1.1"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="0.5">Treasure Island</text>

  <line x1="150" y1="334" x2="250" y2="334" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">An old sea-dog, a knife, and a warning</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">ROBERT LOUIS STEVENSON</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">THE ADMIRAL BENBOW</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
