  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#5C84A8" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#8FB2CC" stroke-width="1"/>

