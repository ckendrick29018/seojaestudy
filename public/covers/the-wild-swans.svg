<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Wild Swans by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-58 14 Q -44 -4 -30 14 Q -16 -4 -2 14" stroke-width="2.1"/>
    <path d="M-10 -8 Q 8 -28 26 -8 Q 44 -28 62 -8" stroke-width="2.6"/>
    <path d="M-34 32 Q -22 17 -10 32 Q 2 17 14 32" stroke-width="1.7" opacity="0.65"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2C2C2C" letter-spacing="1">The Wild</text>
  <text x="200" y="344" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="38" fill="#2C2C2C" letter-spacing="1">Swans</text>

  <line x1="150" y1="378" x2="250" y2="378" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="410" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Eleven shirts, not one word</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#C57B57" letter-spacing="2.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1838</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
