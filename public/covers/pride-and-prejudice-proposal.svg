    <circle cx="0" cy="40" r="3.1" fill="#C9A66B" stroke="none"/>
    <circle cx="0" cy="60" r="2.1" fill="#C9A66B" stroke="none"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2C2C2C" letter-spacing="1">Pride</text>
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#2C2C2C">and</text>
  <text x="200" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39" fill="#2C2C2C" letter-spacing="1">Prejudice</text>

  <line x1="140" y1="412" x2="260" y2="412" stroke="#C57B57" stroke-width="1"/>

