<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Pride and Prejudice, The First Proposal, by Jane Austen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 170)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-70 2.4 A 80 80 0 0 1 70 2.4" stroke-width="2"/>
    <path d="M-24 27 A 27 27 0 0 1 24 27" stroke-width="1.3" opacity="0.85"/>
    <path d="M0 40 L-70 2.4 M0 40 L-41.1 -28.5 M0 40 L0 -40 M0 40 L41.1 -28.5 M0 40 L70 2.4" stroke-width="1.5"/>
