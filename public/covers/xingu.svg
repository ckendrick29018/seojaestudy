    <path d="M-48 -30 L-48 32 Q-48 38 -42 38 L-2 38 L-2 -34 Q-2 -38 -8 -38 L-42 -38 Q-48 -38 -48 -30 Z" stroke-width="1.2" fill="#C9A66B" fill-opacity="0.16"/>
