      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(196 172)" stroke="#C9A66B" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-52 14 q 34 9 100 2 q 9 -1 12 -8 q -44 3 -100 -2 q -10 -1 -12 8 z" stroke-width="1.9"/>
    <path d="M-52 14 l -3 11 q -1 4 4 4 l 12 0 q 4 0 4 -4 l 0 -9" stroke-width="1.7"/>
    <path d="M-46 6 q -3 -27 24 -30 q 10 -1 15 6 q 8 9 22 10 q 20 2 34 12" stroke-width="1.8"/>
