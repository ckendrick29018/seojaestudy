  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="0.5">The Little Red Hen</text>

  <line x1="150" y1="320" x2="250" y2="320" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Then I will do it myself</text>

