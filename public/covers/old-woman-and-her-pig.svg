<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Old Woman and Her Pig, an English fairy tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-22 34 L-22 -8" stroke-width="1.3"/>
    <path d="M22 34 L22 -8" stroke-width="1.3"/>
    <path d="M-22 4 L22 4" stroke-width="1.1"/>
    <path d="M-22 20 L22 20" stroke-width="1.1"/>
    <g transform="translate(0 -22) rotate(-8)">
      <ellipse cx="0" cy="0" rx="17" ry="11" stroke-width="1.2" fill="#C9A66B" fill-opacity="0.22"/>
      <circle cx="15" cy="2" r="5" stroke-width="1" fill="#C9A66B" fill-opacity="0.28"/>
      <circle cx="18" cy="1" r="1.1" fill="#A9663F" stroke="none"/>
      <path d="M-6 -10 L-2 -18 L2 -9 Z" stroke-width="1" fill="#C9A66B" fill-opacity="0.24"/>
      <path d="M-16 4 q -8 4 -12 -2" stroke-width="1"/>
    </g>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">The Old Woman</text>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">and Her Pig</text>

  <line x1="150" y1="348" x2="250" y2="348" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Home at last, safe and sound</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">JOSEPH JACOBS</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">ENGLISH FAIRY TALES</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
