<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Tess of the d'Urbervilles, a novel by Thomas Hardy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-24 -30 L 24 -30 L 24 6 Q 24 30 0 42 Q -24 30 -24 6 Z" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <path d="M-24 -8 L 0 8 L 24 -8" stroke-width="1.1"/>
    <circle cx="0" cy="-18" r="3.2" stroke-width="1" fill="#C9A66B" fill-opacity="0.25"/>
    <circle cx="-13" cy="18" r="2.6" stroke-width="1" fill="#C9A66B" fill-opacity="0.25"/>
    <circle cx="13" cy="18" r="2.6" stroke-width="1" fill="#C9A66B" fill-opacity="0.25"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">Tess of the</text>
  <text x="200" y="320" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">d'Urbervilles</text>

  <line x1="150" y1="348" x2="250" y2="348" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A pedigree, lately discovered</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">THOMAS HARDY</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">1891</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
