<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Cat-kin and the Queen Mother, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="18" cy="-34" r="7" fill="#EBD3B8" fill-opacity="0.8" stroke-width="1.4"/>
    <path d="M-58 12 Q-30 -10 0 8 Q30 -14 58 10" stroke-width="1.4" opacity="0.55"/>
    <path d="M-46 26 Q-20 6 4 24 Q28 2 50 22" stroke-width="1.3" opacity="0.4"/>
    <path d="M0 8 L0 52 M-14 20 Q0 14 14 20" stroke-width="1.6"/>
    <ellipse cx="-16" cy="30" rx="6" ry="9" transform="rotate(-18 -16 30)" fill="#C9A66B" fill-opacity="0.3" stroke-width="1.4"/>
    <ellipse cx="16" cy="34" rx="6" ry="9" transform="rotate(18 16 34)" fill="#C9A66B" fill-opacity="0.3" stroke-width="1.4"/>
    <ellipse cx="0" cy="46" rx="6" ry="9" fill="#C9A66B" fill-opacity="0.3" stroke-width="1.4"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="1">Cat-kin and the</text>
  <text x="200" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="1">Queen Mother</text>

  <line x1="150" y1="358" x2="250" y2="358" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="388" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A jade chariot, and a star by the moon</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
