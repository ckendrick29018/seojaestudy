<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Ant and the Grasshopper, an Aesop's fable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCF6"/>
      <stop offset="1" stop-color="#E4EAC7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 182)" stroke="#6E8F4F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 40 Q-2 10 0 -10" stroke-width="1.8"/>
    <path d="M0 -10 Q-22 -22 -34 -44" stroke-width="1.5"/>
    <path d="M0 2 Q22 -10 36 -30" stroke-width="1.5"/>
    <path d="M0 20 Q-20 14 -32 26" stroke-width="1.5"/>
    <path d="M0 20 Q20 14 32 26" stroke-width="1.5"/>

    <ellipse cx="-34" cy="-44" rx="9" ry="5" transform="rotate(-35 -34 -44)" fill="#C9A66B" fill-opacity="0.16" stroke-width="1.3"/>
    <ellipse cx="36" cy="-30" rx="9" ry="5" transform="rotate(25 36 -30)" fill="#C9A66B" fill-opacity="0.16" stroke-width="1.3"/>
    <ellipse cx="-32" cy="26" rx="8" ry="4.5" transform="rotate(-15 -32 26)" fill="#C9A66B" fill-opacity="0.16" stroke-width="1.3"/>
    <ellipse cx="32" cy="26" rx="8" ry="4.5" transform="rotate(15 32 26)" fill="#C9A66B" fill-opacity="0.16" stroke-width="1.3"/>
    <path d="M-6 -30 Q0 -34 6 -30" stroke-width="1.1" opacity="0.6"/>
    <path d="M-8 -6 Q0 -10 8 -6" stroke-width="1.1" opacity="0.6"/>

    <path d="M-10 40 Q0 46 10 40" stroke-width="1.4"/>
    <path d="M0 40 L0 48" stroke-width="1.6"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="1">The Ant and the</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="1">Grasshopper</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Prepare today for the winter to come</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">AESOP'S FABLES</text>
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">ANCIENT GREECE &#183; C. 6TH CENTURY BCE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FABLES</text>
</svg>
