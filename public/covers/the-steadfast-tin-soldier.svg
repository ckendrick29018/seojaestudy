<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Steadfast Tin Soldier by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 166)" stroke="#C9A66B" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-9 -44 h18 v-15 q 0 -6 -9 -6 q -9 0 -9 6 z"/>
    <path d="M-11 -44 h22" stroke-width="1.4"/>
    <circle cx="0" cy="-36" r="7"/>
    <path d="M-11 -28 q 11 -4 22 0 l -3 34 h-16 z"/>
    <path d="M-12 -6 h24" stroke-width="1" opacity="0.7"/>
    <path d="M10 -24 l 6 4" stroke-width="1.4"/>
    <path d="M15 -34 v46" stroke-width="1.5"/>
    <path d="M0 6 v34"/>
    <path d="M0 40 h11"/>
    <path d="M33 40 l 3 7 8 1 -6 6 2 8 -7 -4 -7 4 2 -8 -6 -6 8 -1 z" stroke-width="1" opacity="0.85"/>
  </g>

  <text x="200" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#2C2C2C" letter-spacing="0.5">The Steadfast</text>
  <text x="200" y="349" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#2C2C2C" letter-spacing="0.5">Tin Soldier</text>

  <line x1="150" y1="384" x2="250" y2="384" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="416" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">Brave on his one leg</text>

  <text x="200" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="2.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="484" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9A8F80" letter-spacing="2">1838</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
