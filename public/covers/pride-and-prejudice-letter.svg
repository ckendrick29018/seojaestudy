<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Pride and Prejudice, Darcy's Letter, by Jane Austen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="-50" y="-30" width="100" height="66" rx="3" stroke-width="2"/>
    <path d="M-50 -27 L0 10 L50 -27" stroke-width="1.6"/>
    <path d="M-50 33 L-16 3 M50 33 L16 3" stroke-width="1.1" opacity="0.6"/>
    <circle cx="0" cy="10" r="8" fill="#C57B57" fill-opacity="0.25" stroke="#C57B57" stroke-width="1.4"/>
    <path d="M0 5 L0 15 M-5 10 L5 10" stroke="#C57B57" stroke-width="1.2"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" letter-spacing="1" fill="#2C2C2C">Pride</text>
  <text x="200" y="340" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-style="italic" fill="#2C2C2C">and</text>
  <text x="200" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="39" letter-spacing="1" fill="#2C2C2C">Prejudice</text>

  <line x1="140" y1="412" x2="260" y2="412" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="444" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="20" font-style="italic" fill="#C57B57">Darcy's Letter</text>
  <text x="200" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="4" fill="#9A8F80">CHAPTER 35</text>

  <text x="200" y="510" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="16" letter-spacing="4" fill="#C57B57">JANE AUSTEN</text>
  <text x="200" y="532" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" letter-spacing="2" fill="#9A8F80">1813</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
