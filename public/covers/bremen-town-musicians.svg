<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Bremen Town Musicians by the Brothers Grimm">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 168)" stroke="#C9A66B" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="-7" cy="15" rx="9" ry="6.5" fill="#C9A66B" stroke="none"/>
    <path d="M1.5 15 L1.5 -17"/>
    <path d="M1.5 -17 q 17 4 15 22"/>
    <path d="M1.5 -6 q 15 4 14 21"/>
    <path d="M-44 30 q 44 -10 88 0" stroke-width="0.9" opacity="0.4"/>
  </g>

  <text x="200" y="312" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="0.5">The Bremen</text>
  <text x="200" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="0.5">Town Musicians</text>

  <line x1="150" y1="383" x2="250" y2="383" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="415" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="#C57B57">Four cast-off animals on the road</text>

  <text x="200" y="461" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="3">BROTHERS GRIMM</text>
  <text x="200" y="483" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">COLLECTED 1819</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
