<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Brief Début of Tildy, by O. Henry">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="30" stroke-width="1.3"/>
    <circle r="21" stroke-width="1" stroke-dasharray="2 3" opacity="0.7"/>
    <path d="M-10 -4 Q0 -14 10 -4" stroke-width="1.3"/>
    <path d="M-11 6 Q0 16 11 6" stroke-width="1.6"/>
    <circle cx="-9" cy="-2" r="1.6" fill="#A9663F" stroke="none"/>
    <circle cx="9" cy="-2" r="1.6" fill="#A9663F" stroke="none"/>
  </g>

  <text x="200" y="276" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2C2C2C" letter-spacing="0.5">The Brief D&#233;but</text>
  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2C2C2C" letter-spacing="0.5">of Tildy</text>

  <line x1="150" y1="328" x2="250" y2="328" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="356" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">One evening, someone noticed her</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="2.5">O. HENRY</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FROM &#8220;THE FOUR MILLION,&#8221; 1906</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
