<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Snow-White and Rose-Red, a Brothers Grimm tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-15" cy="-16" r="7" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <circle cx="15" cy="-16" r="7" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <circle cx="0" cy="2" r="22" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <circle cx="-9" cy="-2" r="1.8" fill="#A9663F" stroke="none"/>
    <circle cx="9" cy="-2" r="1.8" fill="#A9663F" stroke="none"/>
    <ellipse cx="0" cy="10" rx="7" ry="5" stroke-width="1.1" fill="#C9A66B" fill-opacity="0.22"/>
    <circle cx="0" cy="9" r="1.4" fill="#A9663F" stroke="none"/>
    <path d="M-4 13 Q 0 16 4 13" stroke-width="1"/>
    <path d="M-34 4 q 8 -6 12 2 M 34 4 q -8 -6 -12 2" stroke-width="1" opacity="0.5"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="0.5">Snow-White</text>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="0.5">and Rose-Red</text>

  <line x1="150" y1="352" x2="250" y2="352" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A gentle bear, an ungrateful dwarf</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">BROTHERS GRIMM</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">SCHNEEWEISSCHEN UND ROSENROT</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
