<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Unmannerly Tiger, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-52 4 Q-52 -34 0 -34 Q52 -34 52 4 Q52 40 0 48 Q-52 40 -52 4 Z" stroke-width="1.9"/>
    <path d="M-40 -26 L-52 -46 L-24 -30 Z" stroke-width="1.6" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M40 -26 L52 -46 L24 -30 Z" stroke-width="1.6" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M-30 -18 Q-26 -30 -14 -30 M-4 -32 Q0 -34 6 -31 M14 -30 Q26 -30 30 -18" stroke-width="1.3" opacity="0.75"/>
    <path d="M-22 0 Q-14 -6 -6 0" stroke-width="1.3"/>
    <path d="M6 0 Q14 -6 22 0" stroke-width="1.3"/>
    <path d="M0 6 L-5 14 L5 14 Z" fill="#A9663F" stroke="none"/>
    <path d="M0 14 Q-8 22 -18 20 M0 14 Q8 22 18 20" stroke-width="1.3"/>
    <path d="M-38 22 Q-30 30 -18 28 M38 22 Q30 30 18 28" stroke-width="1.1" opacity="0.6"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">The Unmannerly</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">Tiger</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Even the mighty can be outwitted</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS, 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
