      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-32 0 Q -14 -22 20 0 Q -14 22 -32 0 Z" stroke-width="1.6" fill="#C9A66B" fill-opacity="0.16"/>
    <path d="M20 0 L 38 -14 L 34 0 L 38 14 Z" stroke-width="1.4" fill="#C9A66B" fill-opacity="0.16"/>
    <circle cx="-18" cy="-2" r="1.6" fill="#A9663F" stroke="none"/>
    <path d="M-6 -12 Q -2 0 -6 12" stroke-width="1" opacity="0.5"/>
