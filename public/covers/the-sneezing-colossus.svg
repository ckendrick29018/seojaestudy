<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Sneezing Colossus, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-46 34 Q-50 -10 -20 -34 Q0 -46 20 -34 Q50 -10 46 34 Q30 48 0 50 Q-30 48 -46 34 Z" stroke-width="1.8" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M-4 6 Q-2 26 -6 40" stroke-width="1.6"/>
    <ellipse cx="-14" cy="10" rx="3.4" ry="2.4" fill="#A9663F" stroke="none"/>
    <ellipse cx="14" cy="10" rx="3.4" ry="2.4" fill="#A9663F" stroke="none"/>
    <path d="M-14 -14 Q0 -20 14 -14" stroke-width="1.4" opacity="0.6"/>
    <g transform="translate(30 -46)" stroke-width="1.4">
      <path d="M0 18 Q-2 0 0 -18" />
      <circle cx="0" cy="-24" r="9" fill="#EBD3B8" fill-opacity="0.9"/>
    </g>
    <path d="M-58 -4 Q-70 -14 -78 -26 M64 -6 Q76 -16 84 -28" stroke-width="1.3" opacity="0.5"/>
  </g>

  <text x="200" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="1">The Sneezing Colossus</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">One tickle, one pear, one sneeze</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
