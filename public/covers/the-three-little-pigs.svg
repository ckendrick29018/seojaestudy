<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Three Little Pigs, an English fairy tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="26" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <ellipse cx="-11" cy="-24" rx="7" ry="9" stroke-width="1.1" transform="rotate(-18 -11 -24)"/>
    <ellipse cx="11" cy="-24" rx="7" ry="9" stroke-width="1.1" transform="rotate(18 11 -24)"/>
    <ellipse cx="0" cy="6" rx="12" ry="9" stroke-width="1.2" fill="#C9A66B" fill-opacity="0.2"/>
    <circle cx="-4.5" cy="6" r="1.6" stroke-width="0.9"/>
    <circle cx="4.5" cy="6" r="1.6" stroke-width="0.9"/>
    <circle cx="-9" cy="-5" r="2" stroke-width="1"/>
    <circle cx="9" cy="-5" r="2" stroke-width="1"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="0.5">The Three Little Pigs</text>

  <line x1="150" y1="322" x2="250" y2="322" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="354" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">Straw, sticks, and bricks</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">JOSEPH JACOBS</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">ENGLISH FAIRY TALES</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
