<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Story Girl by L. M. Montgomery">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-50 20 Q0 -30 50 20" stroke-width="1.6"/>
    <path d="M-32 8 L-32 -6 M0 -4 L0 -20 M32 8 L32 -6" stroke-width="1.3" opacity="0.7"/>
    <g stroke-width="1.7">
      <circle cx="-32" cy="14" r="9" fill="#EBD3B8" fill-opacity="0.9"/>
      <circle cx="0" cy="2" r="10" fill="#EBD3B8" fill-opacity="0.9"/>
      <circle cx="32" cy="14" r="9" fill="#EBD3B8" fill-opacity="0.9"/>
    </g>
    <path d="M-34 -8 Q-30 -14 -24 -12 M-2 -22 Q2 -28 8 -25 M30 -8 Q34 -14 40 -12" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.4"/>
  </g>

  <text x="200" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="29" fill="#2C2C2C" letter-spacing="1">The Story Girl</text>

  <line x1="150" y1="342" x2="250" y2="342" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="374" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">Every orchard has a story</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="2.5">L. M. MONTGOMERY</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
