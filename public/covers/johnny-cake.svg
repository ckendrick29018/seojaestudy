<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Johnny-Cake, a Joseph Jacobs fairy tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="6" r="30" fill="#C9A66B" fill-opacity="0.24" stroke-width="1.3"/>
    <path d="M-30 6 Q0 -4 30 6" stroke-width="1" opacity="0.5"/>
    <path d="M-46 22 Q-36 12 -26 22 Q-36 32 -46 22 Z" stroke-width="0.9" opacity="0.45"/>
    <path d="M28 30 Q40 18 52 30" stroke-width="0.9" opacity="0.45"/>
