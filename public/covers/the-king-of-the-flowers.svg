<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The King of the Flowers, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 186)">
    <g fill="#C57B57" opacity="0.85">
      <ellipse cx="0" cy="-34" rx="17" ry="26"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(45)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(90)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(135)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(180)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(225)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(270)"/>
      <ellipse cx="0" cy="-34" rx="17" ry="26" transform="rotate(315)"/>
    </g>
    <g fill="#EBD3B8" opacity="0.9">
      <ellipse cx="0" cy="-18" rx="10" ry="16"/>
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(60)"/>
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(120)"/>
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(180)"/>
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(240)"/>
      <ellipse cx="0" cy="-18" rx="10" ry="16" transform="rotate(300)"/>
    </g>
    <circle r="8" fill="#A9663F"/>
    <path d="M-4 40 Q-2 66 -14 84" stroke="#8B9A5B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M4 40 Q2 66 14 84" stroke="#8B9A5B" stroke-width="2" fill="none" stroke-linecap="round"/>
    <ellipse cx="-16" cy="70" rx="7" ry="4" fill="#8B9A5B" transform="rotate(-30 -16 70)"/>
    <ellipse cx="16" cy="70" rx="7" ry="4" fill="#8B9A5B" transform="rotate(30 16 70)"/>
  </g>

  <text x="200" y="296" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">The King of</text>
  <text x="200" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">the Flowers</text>

  <line x1="150" y1="350" x2="250" y2="350" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A royal garden, and an old flower's warning</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
