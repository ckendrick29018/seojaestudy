<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Rose in Bloom by Louisa May Alcott">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 180)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 30 Q-4 6 0 -14" stroke-width="1.6"/>
    <path d="M0 14 Q-16 14 -20 2" stroke-width="1.3"/>
    <path d="M0 22 Q16 22 20 10" stroke-width="1.3"/>
    <g transform="translate(0 -30)" stroke-width="1.6">
      <circle r="12" fill="#F6EADF"/>
      <path d="M0 -12 A12 12 0 0 1 10.4 -6 A8 8 0 0 0 0 -4 A8 8 0 0 0 -10.4 -6 A12 12 0 0 1 0 -12 Z" fill="#EBD3B8"/>
      <path d="M0 -12 A12 12 0 0 0 -10.4 -6 A8 8 0 0 1 0 -4" opacity="0.6"/>
      <path d="M0 -12 A12 12 0 0 1 10.4 -6 A8 8 0 0 1 0 -4" opacity="0.6"/>
      <path d="M-10.4 6 A12 12 0 0 1 10.4 6 A8 8 0 0 0 0 4 A8 8 0 0 0 -10.4 6 Z" opacity="0.6"/>
    </g>
  </g>

  <text x="200" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">Rose in Bloom</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">Something more than pretty</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="2.5">LOUISA MAY ALCOTT</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1876</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
