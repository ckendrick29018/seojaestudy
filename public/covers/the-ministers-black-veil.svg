<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Minister's Black Veil by Nathaniel Hawthorne">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 174)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="4" rx="19" ry="24" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <path d="M-19 -8 Q -21 -23 0 -24 Q 21 -23 19 -8 Q 11 3 0 4 Q -11 3 -19 -8 Z" stroke-width="1.2" fill="#2C2C2C" fill-opacity="0.6"/>
    <path d="M-10 -16 Q -9 -5 -6 4" stroke-width="0.9" opacity="0.5"/>
    <path d="M0 -20 L 0 5" stroke-width="0.9" opacity="0.5"/>
    <path d="M10 -16 Q 9 -5 6 4" stroke-width="0.9" opacity="0.5"/>
    <path d="M-5 15 Q 0 19 5 15" stroke-width="1.1"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">The Minister's</text>
  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">Black Veil</text>

  <line x1="150" y1="352" x2="250" y2="352" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="384" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A parable, and a face never shown again</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">NATHANIEL HAWTHORNE</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">TWICE-TOLD TALES</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
