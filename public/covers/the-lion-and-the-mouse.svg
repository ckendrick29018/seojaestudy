<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Lion and the Mouse, an Aesop's fable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCF6"/>
      <stop offset="1" stop-color="#E4EAC7"/>
    </linearGradient>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#C9A66B" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#C9A66B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#6E8F4F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-4" cy="-6" r="30" fill="url(#glow2)"/>
    <g stroke-width="1.4" opacity="0.85">
      <path d="M-4 -40 L-4 -48"/>
      <path d="M12 -36 L18 -43"/>
      <path d="M24 -24 L32 -29"/>
      <path d="M28 -6 L36 -6"/>
      <path d="M24 12 L31 17"/>
      <path d="M-20 -36 L-26 -43"/>
      <path d="M-32 -24 L-40 -29"/>
      <path d="M-36 -6 L-44 -6"/>
      <path d="M-32 12 L-39 17"/>
    </g>
    <circle cx="-4" cy="-6" r="15" stroke-width="2"/>
    <path d="M-11 -4 Q-4 2 3 -4" stroke-width="1.3"/>
    <circle cx="-9" cy="-9" r="1.4" fill="#6E8F4F" stroke="none"/>
    <circle cx="1" cy="-9" r="1.4" fill="#6E8F4F" stroke="none"/>

    <path d="M14 30 Q22 26 30 29 Q26 32 28 36 Q22 40 16 37 Q12 40 8 37 Q12 33 14 30 Z" stroke-width="1.5" fill="#C9A66B" fill-opacity="0.14"/>
    <path d="M8 33 Q-4 30 -14 34" stroke-width="1.1" opacity="0.6"/>
    <circle cx="10" cy="32" r="1" fill="#6E8F4F" stroke="none"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">The Lion and</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">the Mouse</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">No act of kindness is ever wasted</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">AESOP'S FABLES</text>
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">ANCIENT GREECE &#183; C. 6TH CENTURY BCE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FABLES</text>
</svg>
