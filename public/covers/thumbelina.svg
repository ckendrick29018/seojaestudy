<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Thumbelina by Hans Christian Andersen">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#C9A66B" fill="none" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 44 q -3 -32 0 -50" stroke-width="1.7"/>
    <path d="M0 24 q -22 -5 -31 -22 q 17 -3 31 13" stroke-width="1.6"/>
    <path d="M0 12 q 21 -7 29 -25 q -15 -2 -29 15" stroke-width="1.6"/>
    <path d="M-19 -48 q 0 26 19 32 q 19 -6 19 -32 q -8 9 -19 9 q -11 0 -19 -9 z" stroke-width="1.9"/>
    <path d="M0 -16 v-32 M-10 -46 q 2 17 10 25 M10 -46 q -2 17 -10 25" stroke-width="1" opacity="0.5"/>
