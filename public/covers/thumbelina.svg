  <line x1="150" y1="360" x2="250" y2="360" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">No bigger than a thumb</text>

  <text x="200" y="440" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="2.5">HANS CHRISTIAN ANDERSEN</text>
  <text x="200" y="462" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11" fill="#9A8F80" letter-spacing="2">1835</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
