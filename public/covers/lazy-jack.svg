<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Lazy Jack, a Joseph Jacobs fairy tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="10" rx="14" ry="22" fill="#C9A66B" fill-opacity="0.22" stroke-width="1.2"/>
    <path d="M-14 -6 Q-4 -20 6 -14 Q16 -8 14 6" stroke-width="1"/>
    <path d="M-10 22 L-16 34 M-2 26 L-4 40 M8 24 L14 38" stroke-width="1" opacity="0.55"/>
    <path d="M-30 -2 Q-16 -14 -2 -8" stroke-width="0.9" opacity="0.45"/>
    <path d="M-40 24 Q0 16 40 24" stroke-width="1" opacity="0.35"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2C2C2C" letter-spacing="0.5">Lazy Jack</text>

  <line x1="150" y1="320" x2="250" y2="320" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">I'll do so next time, mother</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">JOSEPH JACOBS</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">ENGLISH FAIRY TALES</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
