    <ellipse cx="-24" cy="-4" rx="10" ry="6" fill="#C9A66B" fill-opacity="0.2" stroke-width="1"/>
    <ellipse cx="26" cy="-30" rx="10" ry="6" fill="#C9A66B" fill-opacity="0.2" stroke-width="1"/>
    <ellipse cx="-20" cy="-52" rx="10" ry="6" fill="#C9A66B" fill-opacity="0.2" stroke-width="1"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">Jack and the</text>
