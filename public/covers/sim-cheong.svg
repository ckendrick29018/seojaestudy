<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Sim Cheong, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 26 C -34 26 -34 -2 -10 -6 C -16 -20 -4 -28 0 -16 C 4 -28 16 -20 10 -6 C 34 -2 34 26 0 26 Z" stroke-width="1.7" fill="#C9A66B" fill-opacity="0.12"/>
    <path d="M-40 30 q 40 14 80 0" stroke-width="1.3" opacity="0.55"/>
    <path d="M-50 38 q 50 16 100 0" stroke-width="1.1" opacity="0.35"/>
  </g>

  <text x="200" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#2C2C2C" letter-spacing="1">심청전</text>

