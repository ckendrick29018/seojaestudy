<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Hans in Luck, a Brothers Grimm tale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="30" rx="34" ry="10" fill="#EBD3B8" fill-opacity="0.5" stroke-opacity="0.6"/>
    <path d="M-26 30 Q-30 -6 0 -10 Q30 -6 26 30 Z" fill="#D4A373" fill-opacity="0.35"/>
    <path d="M-14 -10 L-10 -30 L2 -14 Z" fill="#C9A66B" stroke-opacity="0.7"/>
