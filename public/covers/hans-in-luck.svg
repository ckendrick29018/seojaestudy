  </g>

  <text x="200" y="290" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="1">Hans in Luck</text>

  <line x1="150" y1="316" x2="250" y2="316" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="346" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">Trading everything away, happily</text>

