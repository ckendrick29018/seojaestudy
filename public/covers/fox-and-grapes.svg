<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Fox and the Grapes, an Aesop's fable">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFCF6"/>
      <stop offset="1" stop-color="#E4EAC7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#6E8F4F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 -46 Q28 -42 26 -30 Q34 -28 32 -18" stroke-width="1.6" opacity="0.8"/>
    <path d="M14 -46 Q4 -42 4 -34" stroke-width="1.3" opacity="0.6"/>
    <g stroke-width="1.5">
      <circle cx="24" cy="-14" r="7" fill="#C9A66B" fill-opacity="0.16"/>
      <circle cx="10" cy="-8" r="7" fill="#C9A66B" fill-opacity="0.16"/>
      <circle cx="24" cy="2" r="7" fill="#C9A66B" fill-opacity="0.16"/>
      <circle cx="8" cy="8" r="7" fill="#C9A66B" fill-opacity="0.16"/>
      <circle cx="22" cy="18" r="7" fill="#C9A66B" fill-opacity="0.16"/>
      <circle cx="14" cy="30" r="7" fill="#C9A66B" fill-opacity="0.16"/>
    </g>
    <path d="M-54 40 Q-56 20 -46 8 Q-40 0 -30 2 Q-30 -8 -22 -12 Q-24 -4 -20 2 Q-10 2 -6 10 Q0 16 -8 20 Q-6 26 -14 28 Q-14 34 -22 34 Q-24 40 -32 38 Q-34 44 -42 42 Q-50 44 -54 40 Z" stroke-width="1.8"/>
    <circle cx="-16" cy="10" r="1.6" fill="#6E8F4F" stroke="none"/>
    <path d="M-30 -10 Q-16 -20 -4 -18" stroke-width="1.1" opacity="0.5"/>
  </g>

  <text x="200" y="304" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#2C2C2C" letter-spacing="1">The Fox and</text>
  <text x="200" y="338" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="32" fill="#2C2C2C" letter-spacing="1">the Grapes</text>

  <line x1="150" y1="372" x2="250" y2="372" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="404" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">What we can't have, we call sour</text>

  <text x="200" y="450" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">AESOP'S FABLES</text>
  <text x="200" y="472" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">ANCIENT GREECE &#183; C. 6TH CENTURY BCE</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FABLES</text>
