<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="A Scandal in Bohemia by Arthur Conan Doyle">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="-10" cy="-6" r="26" stroke-width="2.2"/>
    <line x1="9" y1="13" x2="34" y2="38" stroke-width="4"/>
    <path d="M-52 30 q 14 -18 30 -14 q -4 16 -20 22 q -8 -2 -10 -8 Z" stroke-width="1.6"/>
