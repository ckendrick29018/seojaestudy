<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Story of an Hour by Kate Chopin">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 190)" stroke="#C9A66B" fill="none" stroke-linecap="round">
    <rect x="-46" y="-58" width="92" height="116" rx="2" stroke-width="3"/>
    <line x1="0" y1="-58" x2="0" y2="58" stroke-width="2"/>
    <line x1="-46" y1="-8" x2="46" y2="-8" stroke-width="2"/>
    <line x1="-56" y1="58" x2="56" y2="58" stroke-width="3"/>
    <path d="M-34 -32 q 7 -8 14 0 q 7 -8 14 0" stroke-width="2.4"/>
    <path d="M6 -40 q 5 -6 10 0 q 5 -6 10 0" stroke-width="2"/>
  </g>

  <text x="200" y="322" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#2C2C2C" letter-spacing="1">The Story</text>
  <text x="200" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-style="italic" fill="#2C2C2C">of an</text>
  <text x="200" y="414" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="46" fill="#2C2C2C" letter-spacing="2">Hour</text>

  <line x1="150" y1="448" x2="250" y2="448" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="492" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#C57B57" letter-spacing="4">KATE CHOPIN</text>
  <text x="200" y="516" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="12.5" fill="#9A8F80" letter-spacing="2">1894</text>

  <text x="200" y="556" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
