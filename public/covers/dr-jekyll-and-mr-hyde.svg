<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Dr. Jekyll and Mr. Hyde by Robert Louis Stevenson">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-22 40 L -22 -20 Q -22 -40 0 -40 Q 22 -40 22 -20 L 22 40 Z" stroke-width="1.4" fill="#C9A66B" fill-opacity="0.14"/>
    <line x1="-22" y1="40" x2="22" y2="40" stroke-width="1.4"/>
    <circle cx="12" cy="6" r="2.2" fill="#A9663F" stroke="none"/>
    <path d="M-34 44 q 34 10 68 0" stroke-width="1.1" opacity="0.4"/>
    <path d="M-46 50 q 46 12 92 0" stroke-width="1" opacity="0.28"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="0.5">Dr. Jekyll and</text>
  <text x="200" y="332" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="0.5">Mr. Hyde</text>

  <line x1="150" y1="360" x2="250" y2="360" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="392" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A strange door, a cruel stranger, an old friend's secret</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">ROBERT LOUIS STEVENSON</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">STORY OF THE DOOR</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
