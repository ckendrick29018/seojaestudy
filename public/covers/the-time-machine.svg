<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Time Machine by H. G. Wells">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 180)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <line x1="0" y1="0" x2="0" y2="-56" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="40" y2="-40" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="56" y2="0" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="40" y2="40" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="0" y2="56" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="-40" y2="40" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="-56" y2="0" stroke-width="0.8" opacity="0.35"/>
    <line x1="0" y1="0" x2="-40" y2="-40" stroke-width="0.8" opacity="0.35"/>

    <circle cx="0" cy="0" r="44" stroke-width="1.4" fill="#C9A66B" fill-opacity="0.14"/>
    <circle cx="0" cy="0" r="34" stroke-width="0.9"/>
    <line x1="0" y1="0" x2="0" y2="-24" stroke-width="1.6"/>
    <line x1="0" y1="0" x2="16" y2="6" stroke-width="1.6"/>
    <circle cx="0" cy="0" r="2.4" fill="#A9663F" stroke="none"/>

    <path d="M-52 30 L-40 30" stroke-width="1.6"/>
    <path d="M40 30 L52 30" stroke-width="1.6"/>
  </g>

  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">The Time Machine</text>

  <line x1="150" y1="318" x2="250" y2="318" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="348" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A model, a lever, and a room</text>
  <text x="200" y="370" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">that gasped as it vanished</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">H. G. WELLS</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">AN INVENTION</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
