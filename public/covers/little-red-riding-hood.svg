  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">Little Red</text>
  <text x="200" y="353" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="1">Riding Hood</text>

  <line x1="150" y1="388" x2="250" y2="388" stroke="#C57B57" stroke-width="1"/>

