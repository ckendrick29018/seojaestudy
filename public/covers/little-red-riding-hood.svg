      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M0 -18 C -22 -14 -40 6 -44 42 Q 0 54 44 42 C 40 6 22 -14 0 -18 Z" stroke-width="2"/>
    <path d="M0 -46 C -16 -42 -25 -22 -20 -6 Q 0 2 20 -6 C 25 -22 16 -42 0 -46 Z" stroke-width="2"/>
    <path d="M-13 -18 Q 0 -6 13 -18" stroke-width="1.4" opacity="0.8"/>
    <circle cx="0" cy="-7" r="2.4" fill="#C9A66B" stroke="none"/>
