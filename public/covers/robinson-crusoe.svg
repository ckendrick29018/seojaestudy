  <text x="200" y="292" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="0.5">Robinson Crusoe</text>

  <line x1="150" y1="320" x2="250" y2="320" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="352" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">I had an overpowering wish to go to sea</text>

