<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Robinson Crusoe by Daniel Defoe">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-34 18 Q0 30 34 18 L26 26 Q0 36 -26 26 Z" fill="#C9A66B" fill-opacity="0.24" stroke-width="1.1"/>
    <path d="M0 18 L0 -26" stroke-width="1.2"/>
    <path d="M0 -26 Q18 -22 20 -6 Q10 -12 0 -8 Z" fill="#C9A66B" fill-opacity="0.3" stroke-width="1"/>
