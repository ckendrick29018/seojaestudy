<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Hong Gildong-jeon, Korea's first vernacular novel">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-30 30 Q -34 -6 -18 -20 Q -8 -30 0 -30 Q 8 -30 18 -20 Q 34 -6 30 30" stroke-width="1.6"/>
    <path d="M-22 -34 Q 0 -46 22 -34" stroke-width="1.4"/>
    <path d="M0 -30 L 0 30" stroke-width="1" opacity="0.4"/>
    <circle cx="0" cy="8" r="3" fill="#A9663F" stroke="none" opacity="0.6"/>
    <path d="M-40 38 q 40 14 80 0" stroke-width="1" opacity="0.35"/>
  </g>

  <text x="200" y="306" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="28" fill="#2C2C2C" letter-spacing="1">홍길동전</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="372" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A young man sets out to carve his own fate</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN TALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">HONG GILDONG-JEON &#183; ATTR. HEO GYUN</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
