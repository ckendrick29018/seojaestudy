<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Topknots and Crockery Hats, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 176)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-42 70 Q0 50 42 70 Q46 76 42 82 Q0 62 -42 82 Q-46 76 -42 70 Z" stroke-width="1.2" fill="#EBD3B8" fill-opacity="0.5"/>
    <line x1="0" y1="30" x2="0" y2="46" stroke-width="1.4"/>
    <path d="M-52 30 Q-58 -34 0 -46 Q58 -34 52 30 Z" stroke-width="1.8" fill="#C9A66B" fill-opacity="0.18"/>
    <line x1="-52" y1="30" x2="52" y2="30" stroke-width="1.6"/>
    <path d="M-10 -30 L4 -6 L-6 18" stroke-width="1" opacity="0.55"/>
    <ellipse cx="-14" cy="26" rx="2.6" ry="2" fill="#A9663F" stroke="none"/>
    <ellipse cx="14" cy="26" rx="2.6" ry="2" fill="#A9663F" stroke="none"/>
  </g>

  <text x="200" y="296" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">Topknots and</text>
  <text x="200" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#2C2C2C" letter-spacing="0.5">Crockery Hats</text>

  <line x1="150" y1="350" x2="250" y2="350" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">How Korea became the land of hats</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
