<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Old White Whiskers and Mr. Bunny, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 186)">
    <circle r="52" fill="none" stroke="#A9663F" stroke-width="1.2" stroke-dasharray="1 7" stroke-linecap="round" opacity="0.7"/>
    <g fill="#C57B57" opacity="0.9">
      <path d="M0 -70 Q10 -54 3 -42 Q-2 -34 -8 -42 Q-14 -54 0 -70 Z"/>
      <path d="M49.5 -35 Q45 -17 33 -13 Q24 -12 26 -21 Q29 -34 49.5 -35 Z"/>
      <path d="M49.5 35 Q45 17 33 13 Q24 12 26 21 Q29 34 49.5 35 Z"/>
      <path d="M0 70 Q-10 54 -3 42 Q2 34 8 42 Q14 54 0 70 Z"/>
      <path d="M-49.5 35 Q-45 17 -33 13 Q-24 12 -26 21 Q-29 34 -49.5 35 Z"/>
      <path d="M-49.5 -35 Q-45 -17 -33 -13 Q-24 -12 -26 -21 Q-29 -34 -49.5 -35 Z"/>
    </g>
    <circle r="16" fill="#EBD3B8"/>
    <circle cx="-5" cy="-2" r="2" fill="#2C2C2C"/>
    <circle cx="6" cy="1" r="2" fill="#2C2C2C"/>
  </g>

  <text x="200" y="286" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2C2C2C" letter-spacing="0.5">Old White Whiskers</text>
  <text x="200" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="21" fill="#2C2C2C" letter-spacing="0.5">and Mr. Bunny</text>

  <line x1="150" y1="340" x2="250" y2="340" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="368" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A proud tiger outwitted by a clever rabbit</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS &#183; 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
