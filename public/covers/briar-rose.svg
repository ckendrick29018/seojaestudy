<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="Briar Rose, a Brothers Grimm tale also known as Sleeping Beauty">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 172)" stroke="#A9663F" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="0" r="14" stroke-width="1.3" fill="#C9A66B" fill-opacity="0.16"/>
    <path d="M0 -14 C 8 -14 8 -6 0 -6 C -8 -6 -8 -14 0 -14 Z" stroke-width="1"/>
    <path d="M0 14 L 0 46" stroke-width="1.4"/>
    <path d="M0 22 Q -18 22 -22 8 Q -10 6 0 22" stroke-width="1.1" opacity="0.6"/>
    <path d="M0 32 Q 18 32 22 18 Q 10 16 0 32" stroke-width="1.1" opacity="0.6"/>
    <path d="M-6 6 l -8 -6 M 6 6 l 8 -6 M -6 -22 l -6 -8 M 6 -22 l 6 -8" stroke-width="1" opacity="0.45"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" fill="#2C2C2C" letter-spacing="0.5">Briar Rose</text>

  <line x1="150" y1="334" x2="250" y2="334" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="366" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" font-style="italic" fill="#C57B57">A spindle, a hundred-year sleep, and a kiss</text>

  <text x="200" y="456" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="14" fill="#C57B57" letter-spacing="2">BROTHERS GRIMM</text>
  <text x="200" y="478" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">DORNRÖSCHEN</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
