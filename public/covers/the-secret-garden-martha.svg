<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="The Secret Garden: Martha, by Frances Hodgson Burnett">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDFBF7"/>
      <stop offset="1" stop-color="#F6F1E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)" stroke="#C9A66B" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle r="34" stroke-width="1.6"/>
    <circle r="34" stroke-width="1" opacity="0.4" transform="rotate(45)"/>
    <path d="M0 -34 L0 -46 M0 34 L0 46 M-34 0 L-46 0 M34 0 L46 0" stroke-width="1.4"/>
    <rect x="-10" y="-4" width="20" height="26" rx="2" stroke-width="1.6" fill="#EBD3B8" fill-opacity="0.5"/>
    <circle cx="6" cy="9" r="1.6" fill="#A9663F" stroke="none"/>
    <path d="M-10 -4 Q0 -14 10 -4" stroke-width="1.4"/>
  </g>

  <text x="200" y="300" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#2C2C2C" letter-spacing="1">The Secret Garden</text>
  <text x="200" y="330" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#2C2C2C" letter-spacing="2">Martha</text>

  <line x1="150" y1="356" x2="250" y2="356" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="386" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" font-style="italic" fill="#C57B57">A key, buried, and a locked door</text>

  <text x="200" y="452" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="13" fill="#C57B57" letter-spacing="2.5">FRANCES HODGSON BURNETT</text>
  <text x="200" y="474" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="2">FIRST PUBLISHED 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#B7C296" letter-spacing="3">SEOJAE STORY &#183; CLASSICS</text>
</svg>
