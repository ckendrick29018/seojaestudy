<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" role="img" aria-label="A Bridegroom for Miss Mole, a traditional Korean folktale">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDF2EE"/>
      <stop offset="1" stop-color="#F6D9CE"/>
    </linearGradient>
  </defs>
  <rect width="400" height="600" fill="url(#bg)"/>
  <rect x="20" y="20" width="360" height="560" fill="none" stroke="#C57B57" stroke-width="2"/>
  <rect x="30" y="30" width="340" height="540" fill="none" stroke="#D4A373" stroke-width="1"/>

  <g transform="translate(200 178)">
    <path d="M-17 46 L-17 -8 Q-17 -38 0 -38 Q17 -38 17 -8 L17 46 Z"
          stroke="#C9A66B" stroke-width="1.9" fill="#C9A66B" fill-opacity="0.07" stroke-linejoin="round"/>
    <path d="M-17 8 L17 8 M-11 -18 L11 -18" stroke="#C9A66B" stroke-width="1.1" opacity="0.75"/>
    <path d="M-17 46 q17 8 34 0" stroke="#C9A66B" stroke-width="1.4" fill="none"/>

    <g stroke="#A98A5E" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-52 54 q6 -9 17 -9 q10 0 14 7 q3 6 -2 10 q-6 4 -15 3 q-11 -1 -14 -11 z"/>
      <path d="M-52 54 l-7 -3" />
      <path d="M-38 47 q-2 -3 -6 -3" opacity="0.7"/>
    </g>
    <path d="M-62 58 q14 -7 28 -1" stroke="#C9A66B" stroke-width="1.1" opacity="0.45" fill="none"/>
  </g>

  <text x="200" y="308" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">A Bridegroom for</text>
  <text x="200" y="342" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#2C2C2C" letter-spacing="1">Miss Mole</text>

  <line x1="150" y1="376" x2="250" y2="376" stroke="#C57B57" stroke-width="1"/>

  <text x="200" y="408" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="#C57B57">Who is mightiest of all?</text>

  <text x="200" y="454" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="11.5" fill="#C57B57" letter-spacing="1.5">TRADITIONAL KOREAN FOLKTALE</text>
  <text x="200" y="476" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#9A8F80" letter-spacing="1.5">RETOLD BY W. E. GRIFFIS, 1911</text>

  <text x="200" y="566" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="10.5" fill="#C57B57" letter-spacing="3">SEOJAE STORY &#183; FOLKTALES</text>
</svg>
